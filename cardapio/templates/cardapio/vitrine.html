<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardápio Digital - Sushi</title>
    
    <!-- Importação do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <div class="container py-5">
        <h1 class="text-center mb-4">Nosso Cardápio Digital</h1>
        
        <div class="row">
            {% for produto in produtos %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    
                    <!-- Verifica se o produto tem uma foto cadastrada -->
                    {% if produto.imagem %}
                        <!-- card-img-top: classe do Bootstrap para ajustar a imagem no topo do card -->
                        <!-- style="height: 200px; object-fit: cover;": Deixa todas as fotos com o mesmo tamanho padrão sem distorcer -->
                        <img src="{{ produto.imagem.url }}" class="card-img-top" alt="{{ produto.nome }}" style="height: 200px; object-fit: cover;">
                    {% endif %}

                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">{{ produto.nome }}</h5>
                        
                        {% if produto.descricao %}
                            <p class="card-text text-muted">{{ produto.descricao }}</p>
                        {% endif %}
                        
                        <h4 class="text-success mt-3">R$ {{ produto.preco }}</h4>
                        
                        <button class="btn btn-danger w-100 mt-2">Adicionar</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
