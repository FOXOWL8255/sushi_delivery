<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ produto.nome }} - Cardápio Digital</title>
    
    <!-- Importação do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- Botão para voltar à página inicial do cardápio -->
        <a href="{% url 'vitrine' %}" class="btn btn-outline-secondary mb-4">&larr; Voltar ao Cardápio</a>

        <div class="row bg-white p-4 rounded shadow-sm align-items-center">
            
            <!-- Coluna da Esquerda: Imagem do Produto -->
            <div class="col-md-6 mb-3 mb-md-0">
                {% if produto.imagem %}
                    <img src="{{ produto.imagem.url }}" class="img-fluid rounded shadow-sm w-100" style="max-height: 400px; object-fit: cover;" alt="{{ produto.nome }}">
                {% else %}
                    <div class="bg-secondary text-white d-flex align-items-center justify-content-center rounded" style="height: 300px;">
                        <span>Sem imagem disponível</span>
                    </div>
                {% endif %}
            </div>

            <!-- Coluna da Direita: Informações Detalhadas -->
            <div class="col-md-6">
                <!-- Nome da categoria -->
                <span class="badge bg-danger mb-2">{{ produto.categoria.nome }}</span>
                
                <!-- Nome do produto -->
                <h1 class="fw-bold">{{ produto.nome }}</h1>
                
                <!-- Preço -->
                <h3 class="text-success my-3">R$ {{ produto.preco }}</h3>

                <!-- Descrição detalhada -->
                {% if produto.descricao %}
                    <p class="text-muted lead">{{ produto.descricao }}</p>
                {% else %}
                    <p class="text-muted">Nenhuma descrição informada para este produto.</p>
                {% endif %}

                <!-- Botão de ação -->
                <button class="btn btn-danger btn-lg w-100 mt-3">Adicionar ao Pedido</button>
            </div>

        </div>
    </div>

</body>
</html>
